<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('myImage').src='happies.jpg'">Happy Face</button>

<img id="myImage" src="Saddy.jpg" style="width:100px">

<button onclick="document.getElementById('myImage').src='Saddy.jpg'">Sad Face</button>

</body>
</html>
