<!DOCTYPE html>
<html>
<body>

  <!-- LOGIC GATES -->
  <h3>Logic Gates</h3>
  A: <input id="ga" value="0">
  B: <input id="gb" value="0"><br><br>
  
  <button onclick="document.getElementById('go').innerText = (document.getElementById('ga').value == 1 && document.getElementById('gb').value == 1) ? 1 : 0">AND</button>
  <button onclick="document.getElementById('go').innerText = (document.getElementById('ga').value == 1 || document.getElementById('gb').value == 1) ? 1 : 0">OR</button>
  <button onclick="document.getElementById('go').innerText = (document.getElementById('ga').value != document.getElementById('gb').value) ? 1 : 0">XOR</button>
  <button onclick="document.getElementById('go').innerText = (document.getElementById('ga').value == 1) ? 0 : 1">NOT (uses A)</button>
  <p>Gate Output: <b id="go">0</b></p>

  <!-- FLIP-FLOP -->
  <h3>Flip-Flop</h3>
  <button onclick="document.getElementById('ff').innerText = 1">Set (1)</button>
  <button onclick="document.getElementById('ff').innerText = 0">Reset (0)</button>
  <p>Stored: <b id="ff">0</b></p>

  <!-- BMI CALCULATOR -->
  <h3>BMI Calculator</h3>
  Weight (kg): <input id="w"><br>
  Height (cm): <input id="h"><br>
  <button onclick="runBMI()">Calculate</button>
  <p>BMI: <b id="bo"></b></p>

  <!-- BINARY CONVERTER -->
  <h3>Binary to Base 10</h3>
  Binary: <input id="bi"><br>
  <button onclick="runBin()">Convert</button>
  <p>Base 10: <b id="bio"></b></p>

  <script>
    function runBMI() {
      let w = document.getElementById('w').value;
      let h = document.getElementById('h').value / 100;
      document.getElementById('bo').innerText = (w / (h * h)).toFixed(1);
    }

    function runBin() {
      let b = document.getElementById('bi').value;
      document.getElementById('bio').innerText = parseInt(b, 2);
    }
  </script>

</body>
